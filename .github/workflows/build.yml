name: Build and release OCI8 for PHP 8.2-8.5
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oci8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} x64 ${{ matrix.vs }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: [ts, nts]
        include:
          - php: '8.2'
            vs: vs16
          - php: '8.3'
            vs: vs16
          - php: '8.4'
            vs: vs17
          - php: '8.5'
            vs: vs17
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts
        run: |
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Download Oracle Client from private release
        env:
          # Fine-grained PAT: only oracle-client-assets, Contents read-only.
          # The built-in GITHUB_TOKEN cannot read another private repository.
          GH_TOKEN: ${{ secrets.ORACLE_ASSETS_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'Set ORACLE_ASSETS_TOKEN to a fine-grained PAT with Contents: read on weeix/oracle-client-assets only.' }
          New-Item -ItemType Directory -Path C:\oracle-download -Force | Out-Null
          gh release download oracle-11.2.0.1-x64 --repo weeix/oracle-client-assets --pattern V20609-01.zip --dir C:\oracle-download
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated Oracle release asset download failed.' }
          $zip = 'C:\oracle-download\V20609-01.zip'
          $expected = '60063c214cf277a316cf20360f3de4c7830da7aa0ca02bc11386efaa344383f3'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Oracle media SHA256 mismatch.' }
          Move-Item -LiteralPath $zip -Destination C:\oracle-client.zip -Force
          Write-Host 'Private Oracle Client asset downloaded; SHA256 verified.'
      - name: Build DLL
        run: ./Build-OCI8.ps1 -OracleZip C:\oracle-client.zip -WorkDir C:\oci8-build -PhpVersions '${{ matrix.php }}' -ThreadSafety '${{ matrix.ts }}'
      - name: Upload DLL and checksum
        uses: actions/upload-artifact@v4
        with:
          name: php_oci8_11g-php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.vs }}-x64
          path: C:\oci8-build\dist\php${{ matrix.php }}-${{ matrix.ts }}-x64\*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (no Oracle media)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php${{ matrix.php }}-${{ matrix.ts }}
          path: C:\oci8-build\build-php${{ matrix.php }}-${{ matrix.ts }}-x64\**\*.log
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish GitHub release
    needs: build
    if: github.repository == 'weeix/oci8-11g-windows-builds' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: php_oci8_11g-php*-vs*-x64
          path: release-input
          merge-multiple: false
      - name: Verify, package and publish all eight variants
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./Publish-Release.ps1 -Tag $env:RELEASE_TAG
